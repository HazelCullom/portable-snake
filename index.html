<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portable Snake — Demo</title>
  <link rel="stylesheet" href="snake.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      color: #4ade80;
    }

    p.hint {
      margin: 0;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <h1>🐍 Portable Snake</h1>

  <!-- Drop this div anywhere on your page -->
  <div id="snake-game"></div>

  <p class="hint">Arrow keys / WASD to move &nbsp;·&nbsp; P to pause</p>

  <script src="snake.js"></script>
  <script>
    const game = new SnakeGame('#snake-game', {
      gridSize: 20,
      speed: 8,
      cellSize: 24,
      onScore: (score) => console.log('Score:', score),
      onGameOver: (score) => console.log('Game over! Final score:', score),
    });
  </script>
</body>
</html>
